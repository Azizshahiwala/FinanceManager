{% extends 'Homepage.html' %}
{% block title %}Add Expense{% endblock %}

{% block content %}
<div class="form-box">
  <div class="box-heading">Add Expense</div>

  <form method="post" action="{% url 'expenseAdd' %}">
    {% csrf_token %}


    <label for="id_category" style="margin-top:12px;">Category</label>
    <select id="id_category" name="category">
      <option value="Food">Food</option>
      <option value="Transport">Transport</option>
      <option value="Shopping">Shopping</option>
      <option value="Bills">Bills</option>
      <option value="Education">Education</option>
      <option value="Medical">Medical</option>
      <option value="Other">Other</option>
    </select>
    
    <div id="custom-category-box" style="display:none; margin-top:12px;">
      <label for="custom_category">Enter your category</label>
      <input type="text" id="custom_category" name="custom_category" placeholder="Enter your category">
    </div>

    <label for="id_item_name">Purchased name item</label>
    <input type="text" id="id_item_name" name="item_name" placeholder="e.g. Apples">

    <label for="id_amount">Amount (₹)</label>
    <div class="amount-display">
      <input type="number" step="0.01" id="id_amount" name="amount" placeholder="0.00" required>
    </div>

    <div style="display: flex; gap: 10px;">
        <div style="flex: 1;">
            <label for="id_quantity">Qtd</label>
            <input type="number" step="0.01" id="id_quantity" name="quantity" placeholder="e.g. 2">
        </div>
        <div style="flex: 1;">
            <label for="id_unit">Unit</label>
            <input type="text" id="id_unit" name="unit" placeholder="e.g. kg">
        </div>
    </div>

    

    <script>
      const category = document.getElementById('id_category');
      const customCategoryBox = document.getElementById('custom-category-box');

      category.addEventListener('change', function () {
        if (this.value === 'Other') {
          customCategoryBox.style.display = 'block';
        } else {
          customCategoryBox.style.display = 'none';
        }
      });
    </script>
    
    <label for="id_date">Date</label>
    <input type="date" id="id_date" name="date" required>

    <label for="id_description">Description (optional)</label>
    <input type="text" id="id_description" name="description" placeholder="">

    <div style="margin-top: 20px; text-align: left;">
        <div>
            <button type="submit" name="save" class="btn-primary expense-btn" style="border-radius: 4px; padding: 6px 12px; font-size: 14px;">Save</button>
        </div>
    </div>
  </form>
</div>
{% endblock %}
