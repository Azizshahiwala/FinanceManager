{% extends 'Homepage.html' %}
{% block title %}Add Income{% endblock %}

{% block content %}
<div class="form-box">
  <div class="box-heading">Add Income</div>

  <form method="post" action="{% url 'incomeAdd' %}">
    {% csrf_token %}

    <label for="id_category" style="margin-top:12px;">Category</label>
    <select id="id_category" name="category" style="margin-top:12px;">
      <option value="Salary">Salary</option>
      <option value="Freelance">Freelance</option>
      <option value="Business">Business</option>
      <option value="Investment">Investment</option>
      <option value="Other">Other</option>
    </select>

    <div id="custom-category-box" style="display:none; margin-top:12px;">
      <label for="custom_category">Enter your category</label>
      <input type="text" id="custom_category" name="custom_category" placeholder="Enter your category">
    </div>

    <script>
      const category = document.getElementById('id_category');
      const customCategoryBox = document.getElementById('custom-category-box');

      category.addEventListener('change', function () {
        if (this.value === 'Other') {
          customCategoryBox.style.display = 'block';
        } else {
          customCategoryBox.style.display = 'none';
        }
      });
    </script>

    <label for="id_item_name">Income source / item name</label>
    <input type="text" id="id_item_name" name="item_name" placeholder="e.g. Monthly Salary">

    <label for="id_amount">Amount (₹)</label>
    <div class="amount-display">
      <input type="number" step="0.01" id="id_amount" name="amount" placeholder="0.00" required>
    </div>

    <label for="id_date">Date</label>
    <input type="date" id="id_date" name="date" required>

    <label for="id_description">Description (optional)</label>
    <input type="text" id="id_description" name="description" placeholder="">

    <div style="margin-top: 20px; text-align: left;">
      <button type="submit" class="btn-primary">Add Income</button>
    </div>
  </form>
</div>
{% endblock %}
